<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="질량분석 입문자를 위한 스펙트럼 판독 연습 — 동위원소 패턴, 부가체, 중성 손실. 파일 하나로 오프라인에서 동작합니다. / A single-file spectrum-reading trainer for mass spectrometry beginners.">
<title>Isotope Bench — 질량분석 판독 연습</title>
<style>
:root{
  --paper:#EDEFE9;
  --paper-2:#E3E6DE;
  --ink:#17222B;
  --muted:#6B7469;
  --rule:#C6CBC0;
  --trace:#1E4D5C;
  --wrong:#A8323F;
  --right:#4A6E2A;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px; margin:0 auto; padding:20px 18px 60px}

header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
h1{font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0}
h1 span{color:var(--muted); font-weight:400}
.levelbox{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
select,input,button{font-family:inherit; font-size:14px; color:var(--ink)}
select,input[type=text],input[type=number]{
  background:#fff; border:1px solid var(--rule); border-radius:3px; padding:5px 7px;
}
input[type=text],input[type=number]{font-family:var(--mono)}

.langbtn{
  background:none; border:1px solid var(--rule); border-radius:3px;
  padding:4px 10px; cursor:pointer; font-size:12px; color:var(--muted);
}
.langbtn:hover{border-color:var(--trace); color:var(--ink)}
.langbtn:focus-visible{outline:2px solid var(--trace); outline-offset:1px}
nav{display:flex; gap:2px; border-bottom:1px solid var(--rule); margin-bottom:18px}
nav button{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:8px 14px; cursor:pointer; color:var(--muted); font-size:14px;
}
nav button[aria-selected=true]{color:var(--ink); border-bottom-color:var(--trace); font-weight:600}
nav button:focus-visible{outline:2px solid var(--trace); outline-offset:-2px}

.panel{background:#fff; border:1px solid var(--rule); border-radius:4px; padding:14px 16px; margin-bottom:16px}
.plotwrap{padding:8px 6px 4px}
svg{display:block; width:100%; height:auto}

.prompt{font-size:15px; margin:0 0 4px}
.prompt b{font-family:var(--mono); font-weight:600}
.sub{color:var(--muted); font-size:13px; margin:0}

.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:12px}
.opt{
  background:#fff; border:1px solid var(--rule); border-radius:3px;
  padding:10px 12px; text-align:left; cursor:pointer; font-size:15px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--trace)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--right); background:#F0F4EA; color:var(--right); font-weight:600}
.opt.wrong{border-color:var(--wrong); background:#F7EDEE; color:var(--wrong)}
.opt:focus-visible{outline:2px solid var(--trace); outline-offset:1px}

details#q-details{margin-top:12px; border-top:1px solid var(--rule); padding-top:10px}
details#q-details summary{
  cursor:pointer; font-size:14px; color:var(--trace); list-style-position:outside;
  padding:2px 0;
}
details#q-details summary:focus-visible{outline:2px solid var(--trace); outline-offset:2px}
.verdict{margin-top:12px; padding-top:12px; border-top:1px solid var(--rule); font-size:14px}
.verdict .name{font-weight:600}
.actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.btn{
  background:var(--ink); color:var(--paper); border:0; border-radius:3px;
  padding:8px 16px; cursor:pointer; font-size:14px;
}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--rule)}
.btn:focus-visible{outline:2px solid var(--trace); outline-offset:2px}

table{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px}
th,td{text-align:right; padding:4px 8px; border-bottom:1px solid var(--paper-2)}
th:first-child,td:first-child{text-align:left}
td.num,th.num{font-family:var(--mono)}
thead th{color:var(--muted); font-weight:500; border-bottom:1px solid var(--rule)}

.brief{padding:0}
.briefhead{
  display:flex; width:100%; align-items:baseline; justify-content:space-between; gap:12px;
  background:none; border:0; padding:13px 16px; cursor:pointer; text-align:left;
  font-size:15px; font-weight:600; color:var(--ink);
}
.briefhead .caret{font-weight:400; font-size:13px; color:var(--muted); white-space:nowrap}
.briefhead:focus-visible{outline:2px solid var(--trace); outline-offset:-2px}
#brief-body,#appx-body{padding:0 16px 14px}
#appx-body h3, #brief-body h3{
  font-size:13px; font-weight:600; color:var(--trace); margin:14px 0 6px;
  padding-bottom:4px; border-bottom:1px solid var(--paper-2);
}
#appx-body h3:first-child, #brief-body h3:first-child{margin-top:0}
#appx-body ul, #brief-body ul{list-style:none; padding:0; margin:0}
#appx-body ul li, #brief-body ul li{padding:4px 0 4px 14px; position:relative; font-size:14px; max-width:70ch}
#appx-body ul li::before, #brief-body ul li::before{content:"·"; position:absolute; left:2px; color:var(--muted)}
#appx-body code, #brief-body code{font-family:var(--mono); font-size:13px; background:var(--paper); padding:1px 4px; border-radius:2px}
#appx-body td:last-child{text-align:left; max-width:52ch}
sup.fn{
  font-size:10px; font-family:var(--mono); color:var(--trace);
  vertical-align:super; line-height:0; padding-left:1px;
}
ol.notes{list-style:none; counter-reset:note; padding:0; margin:0}
ol.notes li{
  counter-increment:note; position:relative; padding:4px 0 4px 22px;
  font-size:12.5px; color:var(--muted); max-width:74ch;
}
ol.notes li::before{
  content:counter(note); position:absolute; left:0; top:5px;
  font-family:var(--mono); font-size:10px; color:var(--trace);
}
ol.notes a{color:var(--trace); text-decoration:none; border-bottom:1px solid var(--rule)}
ol.notes a:hover{border-bottom-color:var(--trace)}
ol.notes a:focus-visible{outline:2px solid var(--trace); outline-offset:2px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
label.field{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
label.field input,label.field select{width:100%; margin-top:3px}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px}
.stat .v{font-family:var(--mono); font-size:22px; line-height:1.2}
.stat .k{font-size:12px; color:var(--muted)}
.taglist li{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--paper-2)}
ul{list-style:none; padding:0; margin:8px 0 0}
.note{font-size:12px; color:var(--muted); margin-top:10px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Isotope Bench <span id="app-sub">— 질량분석 판독 연습</span></h1>
  <div class="levelbox">
    <button class="langbtn" id="lang-toggle">English</button>
    <label for="level" id="level-label">난이도</label>
    <select id="level"></select>
  </div>
</header>

<nav role="tablist" aria-label="보기 전환" id="tabs">
  <button role="tab" id="tab-quiz" aria-selected="true" aria-controls="view-quiz" tabindex="0" data-i18n="tabQuiz">퀴즈</button>
  <button role="tab" id="tab-lab" aria-selected="false" aria-controls="view-lab" tabindex="-1" data-i18n="tabLab">스펙트럼 실험실</button>
  <button role="tab" id="tab-log" aria-selected="false" aria-controls="view-log" tabindex="-1" data-i18n="tabLog">기록</button>
  <button role="tab" id="tab-about" aria-selected="false" aria-controls="view-about" tabindex="-1" data-i18n="tabAbout">정보</button>
</nav>

<!-- ─────────── 퀴즈 ─────────── -->
<section id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" tabindex="0">
  <div class="panel brief">
    <button class="briefhead" id="brief-toggle" aria-expanded="true">
      <span id="brief-title"></span>
      <span class="caret" id="brief-caret">접기</span>
    </button>
    <div id="brief-body"></div>
  </div>
  <div class="panel brief hidden" id="appx">
    <button class="briefhead" id="appx-toggle" aria-expanded="true">
      <span id="appx-title"></span>
      <span class="caret" id="appx-caret">접기</span>
    </button>
    <div id="appx-body"></div>
  </div>
  <div class="panel plotwrap"><svg id="plot-q" viewBox="0 0 700 268"></svg></div>
  <div class="panel">
    <p class="prompt" id="q-prompt"></p>
    <p class="sub" id="q-sub"></p>
    <div class="opts" id="q-opts"></div>
    <div class="verdict hidden" id="q-verdict"></div>
    <div class="actions">
      <button class="btn" id="q-next" data-i18n="btnNext">다음 문제</button>
    </div>
    <details id="q-details">
      <summary id="q-summary" data-i18n="btnPeaks">피크 표 보기</summary>
      <div id="q-table"></div>
    </details>
  </div>
</section>

<!-- ─────────── 실험실 ─────────── -->
<section id="view-lab" class="hidden" role="tabpanel" aria-labelledby="tab-lab" tabindex="0">
  <div class="panel plotwrap"><svg id="plot-l" viewBox="0 0 700 268"></svg></div>
  <div class="panel">
    <div class="grid2">
      <label class="field"><span data-i18n="labFormula">중성 분자식</span>
        <input type="text" id="l-formula" value="C14H11Cl2NO2" spellcheck="false">
      </label>
      <label class="field"><span data-i18n="labAdduct">이온 폼</span>
        <select id="l-adduct"></select>
      </label>
      <label class="field"><span data-i18n="labThresh">표시 임계값 (기준 피크 대비 %)</span>
        <input type="number" id="l-thresh" value="1" min="0.01" max="50" step="0.1">
      </label>
    </div>
    <div class="actions"><button class="btn" id="l-run" data-i18n="btnRunLab">스펙트럼 계산</button></div>
    <div id="l-out"></div>
  </div>

  <div class="panel">
    <p class="prompt" data-i18n="finderTitle">정확질량으로 분자식 역산</p>
    <p class="sub" data-i18n="finderSub">관측 m/z와 이온 폼을 넣으면 중성 분자식 후보를 찾습니다. C·H·N·O·P·S·Cl·Br 범위만 탐색합니다.</p>
    <div class="grid2">
      <label class="field"><span data-i18n="labMz">관측 m/z</span>
        <input type="number" id="f-mz" value="294.0094" step="0.0001">
      </label>
      <label class="field"><span data-i18n="labAdduct2">이온 폼</span>
        <select id="f-adduct"></select>
      </label>
      <label class="field"><span data-i18n="labPpm">허용 오차 (ppm)</span>
        <input type="number" id="f-ppm" value="5" min="0.1" step="0.1">
      </label>
    </div>
    <div class="actions"><button class="btn" id="f-run" data-i18n="btnRunFinder">후보 검색</button></div>
    <div id="f-out"></div>
  </div>
</section>

<!-- ─────────── 기록 ─────────── -->
<section id="view-log" class="hidden" role="tabpanel" aria-labelledby="tab-log" tabindex="0">
  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="v" id="s-total">0</div><div class="k" data-i18n="statTotal">푼 문제</div></div>
      <div class="stat"><div class="v" id="s-acc">—</div><div class="k" data-i18n="statAcc">정답률</div></div>
      <div class="stat"><div class="v" id="s-streak">0</div><div class="k" data-i18n="statStreak">연속 정답</div></div>
      <div class="stat"><div class="v" id="s-best">0</div><div class="k" data-i18n="statBest">최고 연속</div></div>
    </div>
  </div>
  <div class="panel">
    <p class="prompt" data-i18n="weakTitle">자주 틀리는 항목</p>
    <p class="sub" data-i18n="weakSub">복습 큐를 만들 때 이 태그를 가중치로 쓰면 됩니다.</p>
    <ul class="taglist" id="s-weak"></ul>
  </div>
  <div class="panel">
    <p class="prompt" data-i18n="saveTitle">세이브 파일</p>
    <p class="sub" data-i18n="saveSub">진행도는 브라우저에 JSON으로 저장됩니다. 아래로 파일로 빼두거나 되돌릴 수 있습니다.</p>
    <div class="actions">
      <button class="btn ghost" id="e-export" data-i18n="btnExport">JSON 내보내기</button>
      <button class="btn ghost" id="e-import" data-i18n="btnImport">JSON 불러오기</button>
      <button class="btn ghost" id="e-reset" data-i18n="btnReset">기록 지우기</button>
    </div>
    <input type="file" id="e-file" accept="application/json" class="hidden">
    <p class="note" id="save-note"></p>
  </div>
</section>

<section id="view-about" class="hidden" role="tabpanel" aria-labelledby="tab-about" tabindex="0">
  <div class="panel">
    <p class="prompt" id="about-title"></p>
    <p class="sub" id="about-sub"></p>
    <table><tbody id="about-rows"></tbody></table>
  </div>
  <div class="panel">
    <p class="prompt" id="integrity-title"></p>
    <p class="sub" id="integrity-sub"></p>
    <table><tbody id="integrity-rows"></tbody></table>
    <p class="note" id="integrity-note"></p>
  </div>
</section>

<p class="note" id="foot-note"></p>
</div>

// 중첩 객체까지 얼린다. Object.freeze 는 얕게만 동작한다.
function deepFreeze(o){
  for(const k of Object.keys(o))
    if(o[k] && typeof o[k] === "object") deepFreeze(o[k]);
  return Object.freeze(o);
}

// 키 순서에 흔들리지 않는 표준형 문자열. 중첩 객체까지 재귀로 정렬한다.
function canonical(v){
  if(v === null || typeof v !== "object") return JSON.stringify(v);
  if(Array.isArray(v)) return "[" + v.map(canonical).join(",") + "]";
  return "{" + Object.keys(v).sort()
    .map(k => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}";
}
const buildCanonical = () => canonical(BUILD);

const BUILD_DIGEST = "aa04c4a9ef97e2d9c9f659e59f472c37c75c1141ca712c687da4b42301c27fc1";

async function buildHash(){
  try{
    if(!globalThis.crypto || !crypto.subtle) return null;
    const bytes = new TextEncoder().encode(buildCanonical());
    const buf = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return null; }
}

const ELECTRON = 0.000548580;

// NIST Atomic Weights and Isotopic Compositions 기준 (molmass 2026.8.15에서 추출).
// 존재비가 0이 아닌 안정 동위원소만 담았습니다.

/* ══════════════════════════════════════════════════════════════
   2. 분자식 파서 — 괄호와 첨자 지원  예: (CH3)2SO, C6H5Cl
   ══════════════════════════════════════════════════════════════ */
// 실험실에서 그대로 화면에 뜨는 문구이므로, 메시지 대신 키를 던져
// 현재 언어로 옮겨 쓸 수 있게 한다.
function fErr(code, arg){
  const e = new Error(code);
  e.code = code; e.arg = arg;
  return e;
}
function parseFormula(str){
  const s = str.replace(/\s+/g,"");
  let i = 0;

  function group(){
    const counts = {};
    while(i < s.length){
      const c = s[i];
      if(c === ")"){ break; }
      if(c === "("){
        i++;
        const inner = group();
        if(s[i] !== ")") throw fErr("errParen");
        i++;
        const mult = readNumber();
        for(const el in inner) counts[el] = (counts[el]||0) + inner[el]*mult;
        continue;
      }
      const m = /^([A-Z][a-z]?)/.exec(s.slice(i));
      if(!m) throw fErr("errChar", c);
      const el = m[1];
      if(!ISO[el]) throw fErr("errElement", el);
      i += el.length;
      counts[el] = (counts[el]||0) + readNumber();
    }
    return counts;
  }
  function readNumber(){
    const m = /^(\d+)/.exec(s.slice(i));
    if(!m) return 1;
    i += m[1].length;
    return parseInt(m[1],10);
  }

  const out = group();
  if(i !== s.length) throw fErr("errTrailing");
  const atoms = Object.values(out).reduce((a, b) => a + b, 0);
  if(atoms < 1) throw fErr("errEmpty");
  return out;
}

// Hill 표기: C, H 다음은 알파벳순
const HILL = ["C","H","Br","Cl","F","I","K","N","Na","O","P","S","Si"];
function formatFormula(c){
  const rank = el => { const i = HILL.indexOf(el); return i < 0 ? 999 : i; };
  return Object.keys(c).filter(k => c[k] > 0).sort((a,b) => rank(a) - rank(b))
    .map(k => k + (c[k] > 1 ? c[k] : "")).join("");
}
function addCounts(base, delta, sign){
  const out = Object.assign({}, base);
  for(const el in delta){
    out[el] = (out[el]||0) + sign*delta[el];
    if(out[el] < 0) return null;          // 뺄 수 없는 조합
    if(out[el] === 0) delete out[el];
  }
  return out;
}
function monoisotopicMass(counts){
  let m = 0;
  for(const el in counts) m += ISO[el][0][0] * counts[el];
  return m;
}

/* ══════════════════════════════════════════════════════════════
   3. 동위원소 분포 — 다항식 컨볼루션
   ══════════════════════════════════════════════════════════════ */
const MERGE_MDA = 1;      // 1 mDa 이내 피크는 병합
const PRUNE     = 1e-9;   // 이 확률 아래는 버림

function convolve(a, b){
  const bucket = new Map();
  for(const x of a){
    for(const y of b){
      const p = x.p * y.p;
      if(p < PRUNE) continue;
      const m = x.m + y.m;
      const key = Math.round(m * 1000 / MERGE_MDA);
      const e = bucket.get(key);
      if(e){ e.m = (e.m*e.p + m*p) / (e.p + p); e.p += p; }
      else  { bucket.set(key, {m, p}); }
    }
  }
  return [...bucket.values()].filter(d => d.p >= PRUNE).sort((u,v) => u.m - v.m);
}

// 원소 하나가 n개 있을 때의 분포 (이진 거듭제곱)
function elementDistribution(sym, n){
  let result = [{m:0, p:1}];
  let base = ISO[sym].map(([m,p]) => ({m, p}));
  let k = n;
  while(k > 0){
    if(k & 1) result = convolve(result, base);
    k >>= 1;
    if(k > 0) base = convolve(base, base);
  }
  return result;
}

// 분자식 전체의 동위원소 분포
function isotopeDistribution(counts){
  let dist = [{m:0, p:1}];
  for(const el in counts){
    if(counts[el] <= 0) continue;
    dist = convolve(dist, elementDistribution(el, counts[el]));
  }
  return dist;
}

// 중성 분자식 → 이온 분자식
function ionFormula(neutral, ad){
  const plus = addCounts(neutral, ad.add, +1);
  return plus ? addCounts(plus, ad.sub, -1) : null;
}

// 이온의 m/z 스펙트럼. 전하가 z면 전자 z개만큼 질량 보정.
function ionSpectrum(neutral, ad, thresholdPct){
  const ion = ionFormula(neutral, ad);
  if(!ion) return null;
  const dist = isotopeDistribution(ion);
  const az = Math.abs(ad.z);
  const peaks = dist.map(d => ({ mz: (d.m - ad.z*ELECTRON) / az, p: d.p }));
  const base = Math.max(...peaks.map(p => p.p));
  return peaks
    .map(p => ({ mz: p.mz, rel: 100 * p.p / base }))
    .filter(p => p.rel >= (thresholdPct ?? 0.5))
    .sort((a,b) => a.mz - b.mz);
}

// 이 화합물에 이 부가체가 화학적으로 성립하는가
function adductOK(cmp, ad){
  switch(ad.need){
    case "prot":   return !!cmp.prot;
    case "cat":    return !!cmp.cat;
    case "deprot": return !!cmp.deprot;
    case "anion":  return !!cmp.anion;
    case "acidH":  return !!(cmp.deprot && cmp.cat);
    case "polyB":  return !!cmp.polyB;
    case "poly":   return !!cmp.poly;
  }
  return true;
}

      "여기서 짝수 전자 규칙(even-electron rule)이 작동합니다. ESI의 [M+H]\u207A는 짝수 전자 이온이라 CID에서 주로 안정한 중성 분자를 통째로 잃습니다. 앞 단계의 손실 목록이 H\u2082O, CO, CO\u2082처럼 온전한 분자였던 이유입니다. 반면 EI의 M\u207A\u00B7는 홀수 전자라 \u00B7CH\u2083 같은 라디칼 손실이 흔합니다.",

0:{
  title:"Appendix · Ionization methods and mass analysers",
  toolsTitle:"Choosing an ion source", refTitle:"Analyser performance",
  sections:[
    {h:"Why there is more than one way to make an ion", items:[
      "Molecules differ in polarity, volatility, thermal stability and size, so no single method ionises all of them. That is why there are several sources, and the choice is set jointly by the properties of the sample and the goal of the experiment.",
      "EI (electron ionization): a filament set to about 70 eV produces high-energy electrons that collide with gas-phase molecules and knock an electron out. Mostly singly charged positive ions result, and because the process is energetic it cleaves covalent bonds and gives repeatable fragmentation. That repeatability is what allows identification against spectral libraries. It applies to samples thermally stable and light enough to enter the gas phase, so it usually sits behind a GC.[^1]",
      "CI (chemical ionization): a reagent gas such as methane or ammonia is ionised first, and those ions transfer a proton to the analyte. Like EI it is restricted to relatively volatile samples, but it is softer and suits more polar compounds. It is paired with EI when the molecular ion has disappeared and the molecular weight needs confirming.[^2]",
      "ESI (electrospray ionization): a high voltage applied to a liquid produces a charged aerosol. It generates quasi-molecular ions such as [M+H]⁺ or [M−H]⁻ from non-volatile, polar analytes in solution. Small molecules of roughly 50–2000 Da are routine, and peptides and proteins pick up multiple charges so that large molecules appear at low m/z. It couples easily to LC and is the most widely used source today.[^3]",
      "APCI (atmospheric pressure chemical ionization): the sample solution is vaporised in a heated tube, nebulised with nitrogen and passed through a corona discharge. It usually yields [M+H]⁺ and can ionise less polar compounds than ESI. It accepts high flow rates around 1 mL/min, which suits conventional HPLC. The heating step makes it unsuitable for thermally fragile samples.[^2][^4]",
      "APPI (atmospheric pressure photoionization): ionisation by photons. It is used for compounds with almost no polar functional groups — polycyclic aromatics, steroids, and pesticides or drug metabolites lacking polar handles. A dopant is often added to improve response.[^5]",
      "MALDI (matrix-assisted laser desorption/ionization): the sample is co-crystallised with a matrix and hit with a laser. The matrix absorbs the energy on the analyte's behalf, so large biomolecules survive largely intact. It gives mainly singly charged ions and is usually paired with TOF. Rastering a tissue section across a grid turns it into mass spectrometry imaging.[^6]",
      "Ambient ionization: the sample goes neither into a vacuum nor through sample preparation — the surface is ionised as it is, in open air. The two established techniques differ completely in what their names stand for and in how they work.[^12]",
      "DESI (desorption electrospray ionization): charged solvent droplets produced by an electrospray are aimed directly at the surface. The droplets form a thin liquid film in which the analyte dissolves, and subsequent impacting droplets splash that film off as secondary droplets carrying the analyte. Desolvation from there on is the same as in ESI, so the ion chemistry follows ESI too.[^12][^13]",
      "DART (direct analysis in real time): helium or nitrogen is passed through a glow discharge to create atoms in a metastable excited state; charged particles are filtered out and only the heated gas stream reaches the sample. The metastable helium state He(2³S) carries 19.8 eV of internal energy, far above water's 12.6 eV ionization energy, so it Penning-ionises atmospheric water. The resulting protonated water clusters transfer a proton to any analyte with a higher proton affinity than water, giving [M+H]⁺. In negative mode, superoxide anion water clusters play the same role.[^12][^13]",
      "In short, DESI follows ESI ion chemistry and DART follows APCI ion chemistry. DART gives simple spectra with essentially no multiply charged ions, few alkali adducts and little fragmentation, along with high salt tolerance and no sample carryover. DESI can be rastered across a surface, which makes it well suited to imaging. Helium supply problems have recently driven interest in alternative gases such as nitrogen and argon.[^13]",
      "In short: volatile small molecules go to GC-EI or CI, polar and non-volatile ones to LC-ESI, less polar ones to APCI, essentially non-polar ones to APPI, and large biomolecules to MALDI or ESI. In fields such as metabolomics, where sample properties vary widely, testing more than one source is a common way to broaden coverage.[^6]"
    ]},
    {h:"How an analyser separates m/z", items:[
      "First, a definition. A resolving power of 1,000 means the instrument can separate m/z 100.0 from m/z 100.1. Separating CO (27.9949) from C₂H₄ (28.0313), as in the earlier levels, requires far more than that.",
      "Quadrupole: four rods carrying RF and DC voltages act as a mass filter, letting only a chosen m/z through on a stable trajectory. Resolving power is limited, so only whole numbers are distinguished, but quadrupoles are rugged, inexpensive and also serve as ion guides and collision cells. They are the core of triple-quadrupole MRM quantitation.[^7]",
      "Ion trap: ions are held and then released in sequence. Because they can be fragmented repeatedly while trapped, MSⁿ is possible and full-scan sensitivity is high. Resolution is limited, and space-charge effects make careful tuning necessary before the trap can be used quantitatively.[^7]",
      "TOF (time-of-flight): ions are accelerated to the same kinetic energy and the time to reach the detector is measured, so lighter ions arrive first. There is effectively no upper mass limit and scanning is fast, which suits rapid chromatography. High-end instruments reach around 60,000 at m/z 200.[^11] The spread in ion kinetic energy sets the accuracy limit.[^10]",
      "Orbitrap: the oscillation frequency of ions orbiting in an electrostatic field is measured and Fourier transformed into a spectrum. Frequencies can be measured far more precisely than flight times, so mass accuracy exceeds that of TOF. Maximum resolution reaches 1,000,000 FWHM at m/z 200 with sub-1 ppm mass accuracy.[^8][^10]",
      "FT-ICR: the cyclotron resonance frequency of ions in a superconducting magnet is measured. It offers the highest resolving power and mass accuracy of any analyser available, resolving power above 10⁶ at m/z 400 and accuracy down to about 0.1 ppm.[^11] In exchange, acquisition is slow and there is no automatic gain control, so it is used more often with direct infusion than with LC, and the magnet is expensive to maintain.[^7][^9]",
      "Hybrids: chaining analysers of different character is now standard. A quadrupole selects the precursor and a TOF or Orbitrap measures it precisely, giving Q-TOF and Q-Orbitrap; for dedicated quantitation there is the triple quadrupole."
    ]},
    {h:"Choosing a combination", items:[
      "If the goal is quantitation, use triple-quadrupole MRM. It is strongest at measuring known compounds at low concentration.",
      "If the goal is identifying unknowns, go high resolution. Narrowing formula candidates needs ppm-level mass accuracy, which means a Q-TOF or an Orbitrap.",
      "Higher resolution trades against scan speed. Check first that you can still place enough points across a chromatographic peak.",
      "Consider dynamic range too. If a calibration curve has to span a wide concentration range, quadrupoles are often better suited than trap-based analysers.",
      "On shared instruments the source and analyser combinations are already fixed. Checking which combinations exist before designing the sample preparation saves time."
    ]}

5:{
  title:"Appendix · MS/MS — why it is needed, where it is used, what it is done with",
  sections:[
    {h:"Why break the molecule a second time", items:[
      "MS1 gives you a mass and nothing else. If two things weigh the same, there is no way to tell them apart. Glucose, fructose and galactose are all C₆H₁₂O₆ with identical accurate masses, and no amount of resolution will separate them. To distinguish isomers you have to break them and look at the pieces.",
      "High resolution gives composition, not connectivity. The sequence of a peptide, which of three serines carries the phosphate, where a sugar is attached — that information exists only in the mass differences between fragments.",
      "There is also a selectivity problem in complex samples. A drop of plasma holds thousands of species, so a single MS1 m/z contains several compounds at once. Specifying both a precursor and a fragment makes it very unlikely that an interference satisfies both conditions. This is the basis of MRM quantitation.",
      "Sensitivity follows. Watching only a defined transition removes the rest of the signal from the background, which is why trace analysis moves to MS/MS."
    ]},
    {h:"How it works", items:[
      "On a triple quadrupole, Q1 lets a single precursor ion through, the collision cell at q2 makes it collide with an inert gas, and Q3 scans the fragments produced. This collision-induced dissociation (CID) is the basic operation of MS/MS.",
      "The even-electron rule matters here. The [M+H]⁺ from ESI is an even-electron ion, so under CID it mostly loses whole stable neutral molecules. That is why the loss list in the earlier levels consisted of intact molecules such as H₂O, CO and CO₂. The M⁺· from EI is odd-electron and frequently loses radicals such as ·CH₃ instead.",
      "There are four scan modes. A product ion scan examines the structure of one compound. A precursor ion scan finds every compound that yields a given fragment. A neutral loss scan finds every compound that loses a given neutral. SRM/MRM fixes one precursor and one fragment for quantitation.",
      "Standard experiments exploit exactly this. Phospholipids share the phosphocholine fragment at 184.0739, so a precursor ion scan sweeps them all at once. Glucuronide metabolites are found by a neutral loss scan of 176.0321. Phosphopeptides are screened in negative mode by a precursor ion scan of the PO₃⁻ ion at m/z 79.",
      "Peptides break at the amide bond in a regular way, giving b and y ion series under CID. The difference between two adjacent fragments equals one residue, so the sequence can be read off. ETD gives c and z series instead and tends not to strip labile modifications, which helps when localising a phosphorylation site.",
      "In practice you select [M+H]⁺ as the precursor rather than [M+Na]⁺. With the charge held on sodium, CID gives few usable fragments.",
      "A narrow isolation window clips the isotope cluster; a wide one co-isolates neighbours and gives a chimeric spectrum. When a fragment cannot be explained, check the isolation window first.",
      "Collision energy is not a single fixed value. Too low leaves only the precursor, too high leaves only low-mass fragments, so ramp across several values and record the optimum per compound.",
      "For quantitation, take at least two transitions: one to quantify and one to confirm. Checking that their intensity ratio matches the standard is what validates the identification.",
      "ESI-MS/MS spectra are not as reproducible between instruments as EI spectra are. When depositing to or matching against a library, always record the collision energy and instrument conditions alongside."
    ]},
    {h:"Where it is used", items:[
      "Proteomics: proteins are digested with trypsin, fragment spectra are collected by LC-MS/MS, and sequences are identified by database search. Localising post-translational modifications such as phosphorylation, acetylation and glycosylation is the classic application.",
      "Metabolomics and lipidomics: structures are proposed for unknown peaks found in untargeted profiling. Most of them are absent from libraries, so in silico prediction tools are used alongside.",
      "DMPK in drug development: plasma drug concentrations are quantified by MRM and metabolites are found by neutral loss scanning.",
      "Clinical testing: newborn screening for metabolic disorders runs on tandem MS, and therapeutic drug monitoring, vitamin D and steroid assays work on the same principle.",
      "Doping control and forensic toxicology: the goal is trace confirmation, and matching two transitions with the correct intensity ratio is a requirement for evidential quality.",
      "Environmental and food analysis: hundreds of pesticide or antibiotic residues are quantified in a single injection.",
      "Synthetic and natural product chemistry: reaction monitoring, by-product checks and supporting evidence for a proposed structure. Unlike NMR it works on trace amounts and couples directly to chromatography."
    ]},
    {h:"Choosing tools", items:[
      "Vendor software handles acquisition and first-pass processing, while interpretation usually moves elsewhere. The first step is therefore almost always format conversion. Once ProteoWizard's msconvert turns vendor files into mzML, the rest of the toolchain is open to you.",
      "Proteomics can be done entirely with free tools. For a student or individual researcher, starting with MaxQuant or FragPipe is standard, and for targeted work Skyline is effectively the only choice. FragPipe wraps the MSFragger search engine together with IonQuant for quantitation and Philosopher for post-processing, and covers DDA, DIA and TMT workflows.[^1][^2][^3]",
      "On the metabolomics side no single program does everything. Feature detection, library search and in silico prediction are separate tools that have to be stacked in order: MS-DIAL or MZmine for features, then GNPS2, MoNA and METLIN for library search, then SIRIUS/CSI:FingerID for prediction.[^4]",
      "SIRIUS determines the molecular formula of the precursor and annotates each fragment peak with a formula, building a fragmentation tree, but it does not do peak picking, so feed it results preprocessed with XCMS or MZmine. Proposing structures is the job of CSI:FingerID or MetFrag.[^5]",
      "In silico prediction tools still have clear limits when used alone without reference standards. Run them alongside library search and confirm the final assignment against an authentic standard.[^6]"
    ]}
  ],

   6. 세이브 — JSON, 버전 포함, 실패해도 게임은 계속

// 외부에서 들어온 문자열을 DOM 에 넣기 전에 반드시 통과시킨다
const esc = v => String(v).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 링크로 쓸 수 있는 URL 인지 확인한다.
// javascript: 를 정규식으로 막으려 하면 java&#9;script: 같은 변형에 뚫린다.
// 브라우저와 같은 URL 파서로 정규화한 뒤 http/https 만 허용하는 편이 확실하다.
function safeUrl(u){
  if(!u) return null;
  try{
    // base 를 주지 않으므로 절대 URL 만 통과한다. 상대 경로를 허용하면
    // 빈 문자열이 페이지 자신을 가리키는 링크가 되어 버린다.
    const parsed = new URL(String(u));
    return (parsed.protocol === "https:" || parsed.protocol === "http:") ? parsed.href : null;
  }catch(e){
    return null;                      // 파싱 자체가 안 되면 링크로 쓰지 않는다
  }
}

const SAVE_KEY = "isotope_bench_save";
const SAVE_VERSION = 1;

function blankSave(){
  return { version: SAVE_VERSION, lang: "ko", level: 0, total: 0, correct: 0,
           streak: 0, best: 0, weakTags: {}, briefed: {}, appx: {}, savedAt: Date.now() };
}
let save = blankSave();
let storageOK = true;

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return blankSave();
    const data = JSON.parse(raw);
    return data.version === SAVE_VERSION ? sanitize(data) : migrate(data);
  }catch(e){
    return blankSave();                       // 손상된 세이브는 조용히 새로 시작
  }
}
function migrate(old){
  return sanitize(Object.assign(blankSave(), old, { version: SAVE_VERSION }));
}

// 불러온 세이브는 신뢰하지 않는다. 아는 필드만 화이트리스트로 재구성한다.
function knownTags(){
  return new Set([
    ...ADDUCTS.map(a => "adduct:" + a.id),
    ...ADDUCTS.map(a => "basic:"  + a.id),
    ...LOSSES .map(l => "loss:"   + l.id),
    ...PATTERNS.map(p => "pattern:" + p.id)
  ]);
}
function sanitize(raw){
  const out = blankSave();
  if(!raw || typeof raw !== "object") return out;
  const int = (v, lo, hi) => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo;
  };
  const maxLv = Math.max(...LEVELS.map(l => l.v));
  out.lang   = raw.lang === "en" ? "en" : "ko";
  out.level  = int(raw.level,  0, maxLv);
  out.total  = int(raw.total,  0, 1e9);
  out.correct= int(raw.correct,0, out.total);
  out.streak = int(raw.streak, 0, 1e9);
  out.best   = int(raw.best,   0, 1e9);
  out.savedAt= Number.isFinite(+raw.savedAt) ? +raw.savedAt : Date.now();

  const known = knownTags();
  out.weakTags = {};
  for(const k in (raw.weakTags || {}))
    if(known.has(k)) out.weakTags[k] = int(raw.weakTags[k], 0, 1e6);

  const flags = src => {
    const o = {};
    for(const k in (src || {})) {
      const n = parseInt(k, 10);
      if(Number.isFinite(n) && n >= 0 && n <= maxLv && src[k]) o[n] = true;
    }
    return o;
  };
  out.briefed = flags(raw.briefed);
  out.appx    = flags(raw.appx);
  return out;
}
function persist(){
  save.savedAt = Date.now();
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    storageOK = true;
  }catch(e){
    storageOK = false;
    document.getElementById("save-note").textContent =
      e.name === "QuotaExceededError" ? t("quotaFull") : t("storageBlocked");
  }
}
function recordAnswer(ok, tag){
  save.total++;
  if(ok){
    save.correct++;
    save.streak++;
    save.best = Math.max(save.best, save.streak);
    if(save.weakTags[tag]) save.weakTags[tag] = Math.max(0, save.weakTags[tag] - 1);
  }else{
    save.streak = 0;
    save.weakTags[tag] = (save.weakTags[tag] || 0) + 1;
  }
  persist();
  renderStats();
}

/* ══════════════════════════════════════════════════════════════
   7. 스펙트럼 그리기 (SVG)
   ══════════════════════════════════════════════════════════════ */
function drawSpectrum(svg, peaks, opts){
  opts = opts || {};
  const W = 700, H = 268, L = 44, R = 14, T = 44, B = 34;
  const pw = W - L - R, ph = H - T - B;
  svg.innerHTML = "";
  svg.setAttribute("role", "img");
  const ns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(ns, tag);
    for(const k in attrs) n.setAttribute(k, attrs[k]);
    if(text != null) n.textContent = text;
    svg.appendChild(n);
    return n;
  };

  if(!peaks || !peaks.length){
    svg.setAttribute("aria-label", t("noPeaks"));
    el("text", {x:W/2, y:H/2, "text-anchor":"middle", fill:"#6B7469", "font-size":13},
       t("noPeaks"));
    return;
  }
  // 스크린리더용 요약. 자세한 값은 바로 아래 피크 표에서 읽을 수 있다.
  {
    const top = [...peaks].sort((a,b) => b.rel - a.rel).slice(0,3)
      .map(p => (opts.showMz === false ? p.rel.toFixed(0) + "%"
                                       : "m/z " + p.mz.toFixed(opts.dp ?? 3) +
                                         " (" + p.rel.toFixed(0) + "%)")).join(", ");
    svg.setAttribute("aria-label", LANG === "ko"
      ? `질량 스펙트럼. 피크 ${peaks.length}개. 세기가 큰 순서로 ${top}. 자세한 값은 아래 피크 표를 참고하세요.`
      : `Mass spectrum with ${peaks.length} peaks. Strongest first: ${top}. Full values are in the peak table below.`);
  }

  const lo = peaks[0].mz, hi = peaks[peaks.length-1].mz;
  const pad = Math.max((hi - lo) * 0.25, 1.2);
  const x0 = lo - pad, x1 = hi + pad;
  const X = mz => L + (mz - x0) / (x1 - x0) * pw;
  const Y = rel => T + ph - rel/100 * ph;

  // 세로 눈금
  for(let r = 0; r <= 100; r += 25){
    el("line", {x1:L, y1:Y(r), x2:W-R, y2:Y(r), stroke:"#E3E6DE", "stroke-width":1});
    el("text", {x:L-8, y:Y(r)+4, "text-anchor":"end", fill:"#6B7469", "font-size":10,
                "font-family":"ui-monospace, monospace"}, r);
  }
  el("line", {x1:L, y1:Y(0), x2:W-R, y2:Y(0), stroke:"#17222B", "stroke-width":1});

  const showMz = opts.showMz !== false;
  const labelMin = opts.labelMin ?? 4;
  const dp = opts.dp ?? 3;

  // 막대는 모든 피크를 그린다
  for(const p of peaks){
    const x = X(p.mz);
    el("line", {x1:x, y1:Y(0), x2:x, y2:Y(p.rel), stroke:"#1E4D5C", "stroke-width":2.2,
                "stroke-linecap":"butt"});
  }

  // 제목은 왼쪽 위 고정. 라벨 배치에서 이 영역을 피한다.
  const titleTxt = tx(opts.title) || "";
  if(titleTxt) el("text", {x:12, y:14, fill:"#6B7469", "font-size":11}, titleTxt);

  // 라벨은 세기가 큰 피크부터 자리를 잡고, 이미 놓인 것과 겹치면 건너뛴다.
  // 미세 동위원소처럼 x가 거의 같은 피크들이 글자를 포개는 것을 막는다.
  const taken = titleTxt ? [{x0:8, x1:16 + titleTxt.length*6.4, y0:0, y1:16}] : [];
  const free = b => !taken.some(o => b.x0 < o.x1 && o.x0 < b.x1 && b.y0 < o.y1 && o.y0 < b.y1);
  let hidden = 0;

  for(const p of [...peaks].sort((a,b) => b.rel - a.rel)){
    if(p.rel < labelMin) continue;
    const s1 = showMz ? p.mz.toFixed(dp) : p.rel.toFixed(0);
    const s2 = showMz ? p.rel.toFixed(1) : null;
    const w  = Math.max(s1.length*6.2, s2 ? s2.length*5.6 : 0);
    const cx = Math.min(Math.max(X(p.mz), L + w/2), W - R - w/2);   // 좌우 잘림 방지
    const yT = Y(p.rel);
    const box = {x0:cx - w/2 - 3, x1:cx + w/2 + 3, y0:yT - (s2 ? 25 : 14), y1:yT - 1};
    if(!free(box)){ hidden++; continue; }
    taken.push(box);
    el("text", {x:cx, y:yT-6, "text-anchor":"middle", fill:"#17222B", "font-size":10,
                "font-family":"ui-monospace, monospace"}, s1);
    if(s2) el("text", {x:cx, y:yT-17, "text-anchor":"middle", fill:"#6B7469", "font-size":9,
                       "font-family":"ui-monospace, monospace"}, s2);
  }

  el("text", {x:(L+W-R)/2, y:H-6, "text-anchor":"middle", fill:"#6B7469", "font-size":11},
     showMz ? t("axisMz") : t("axisRel"));
  // 자리가 없어 생략된 라벨이 있으면 표에서 확인하라고 알린다
  if(hidden)
    el("text", {x:W-R, y:H-6, "text-anchor":"end", fill:"#6B7469", "font-size":10},
       "+" + hidden + (LANG === "ko" ? " 라벨 생략" : " labels hidden"));
}

function peakTable(peaks, dp, charge){
  const az = Math.abs(charge || 1);
  let h = `<table><thead><tr><th>${t("thPeak")}</th><th class="num">${t("thMz")}</th>` +
          `<th class="num">${t("thRel")}</th></tr></thead><tbody>`;
  peaks.forEach((p,i) => {
    const label = i === 0 ? "M" : "M+" + Math.round((p.mz - peaks[0].mz) * az);
    h += `<tr><td>${label}</td><td class="num">${p.mz.toFixed(dp ?? 4)}</td>` +
         `<td class="num">${p.rel.toFixed(2)}</td></tr>`;
  });
  return h + "</tbody></table>";
}

/* ══════════════════════════════════════════════════════════════
   8. 퀴즈 로직
   ══════════════════════════════════════════════════════════════ */
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// 화합물 이름. 문제 문장은 두 언어를 모두 만들어 두므로 언어별 함수를 따로 쓴다.
// 국문에서는 영문명을 괄호로 덧붙인다.
const cmpKo = c => c.n === c.e ? c.n : `${c.n}(${c.e})`;
const cmpEn = c => c.e;
function sample(arr, n){
  const c = arr.slice();
  for(let i = c.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c.slice(0, n);
}

let current = null;

// 난이도 0은 등급 필터 밖에 있으므로 풀을 따로 정한다
function adductPool(lv){
  return lv <= 0 ? ADDUCTS.filter(a => a.id === "M+H" || a.id === "M+Na")
                 : ADDUCTS.filter(a => a.tier <= lv);
}
function compoundPool(lv){
  return COMPOUNDS.filter(c => c.tier <= Math.max(1, lv));
}

// 유형 D — 부가체를 알려주고 중성 질량을 계산하게 한다 (입문)
function makeBasicQuestion(lv){
  const pairs = [];
  for(const c of compoundPool(lv))
    for(const a of adductPool(lv))
      if(adductOK(c, a)) pairs.push([c, a]);
  if(!pairs.length) return null;
  const [cmp, ad] = pick(pairs);
  const neutral = parseFormula(cmp.f);
  const peaks = ionSpectrum(neutral, ad, 1);
  if(!peaks) return null;

  const mz = peaks[0].mz;
  const M  = monoisotopicMass(neutral);
  const dH = monoisotopicMass({H:1}) - ELECTRON;          // 1.00728
  const dNa = monoisotopicMass({Na:1}) - ELECTRON;

  // 오답은 초보자가 실제로 저지르는 실수로 만든다
  const traps = [
    mz,                                    // 부가체를 빼지 않음
    mz + (mz - M),                         // 빼야 할 것을 더함
    ad.id === "M+H" ? mz - dNa : mz - dH   // 다른 부가체로 착각
  ];
  const seen = new Set([M.toFixed(4)]);
  const opts = [{id:M.toFixed(4), label:M.toFixed(4)}];
  for(const t of traps){
    const k = t.toFixed(4);
    if(t > 0 && !seen.has(k)){ seen.add(k); opts.push({id:k, label:k}); }
  }
  if(opts.length < 2) return null;

  // [M−H]⁻ 처럼 이온이 중성보다 가벼우면 빼는 것이 아니라 더하는 계산이 된다.
  // "− -1.0073" 으로 적으면 입문자가 읽기 어려우므로 부호를 문장에 녹인다.
  const d = mz - M;
  const step = `${d < 0 ? "+" : "−"} ${Math.abs(d).toFixed(4)}`;

  return {
    kind:"basic", peaks, answer:M.toFixed(4), options:sample(opts, opts.length), charge:ad.z,
    tag:"basic:" + ad.id,
    prompt:P(`이 스펙트럼은 <b>${ad.label}</b> 입니다. 중성 분자의 ` +
             `단일동위원소 질량(monoisotopic mass)은 얼마입니까?`,
            `This spectrum is <b>${ad.label}</b>. What is the monoisotopic mass ` +
             `of the neutral molecule?`),
    sub:P("관측된 m/z에서 붙은 것은 빼고 떨어져 나간 것은 더해야 합니다. 전자 질량까지 고려하면 양성자(proton)는 1.00728입니다.",
          "Subtract what was added to the observed m/z, and add back what was removed. Allowing for the electron, a proton is 1.00728."),
    reveal:P(`${cmpKo(cmp)} · ${formatFormula(neutral)} · 관측 m/z ${mz.toFixed(4)} ` +
             `${step} = ${M.toFixed(4)}`,
            `${cmpEn(cmp)} · ${formatFormula(neutral)} · observed m/z ${mz.toFixed(4)} ` +
             `${step} = ${M.toFixed(4)}`),
    plot:{showMz:true, dp:4, title:`${ad.z > 0 ? "ESI+" : "ESI−"}`}
  };
}

const MAKERS = {basic: makeBasicQuestion, adduct: makeAdductQuestion,
                pattern: makePatternQuestion, loss: makeLossQuestion};

function newQuestion(){
  const lv = save.level;
  const bag = lv <= 0 ? ["basic","basic","adduct"]
            : lv === 1 ? ["basic","adduct","adduct","loss"]
                       : ["adduct","adduct","pattern","pattern","loss","loss"];
  let q = null;
  for(const kind of sample(bag, bag.length)){        // 실패하면 다른 유형으로
    q = MAKERS[kind](lv);
    if(q) break;
  }
  current = q || makeBasicQuestion(lv) || makeAdductQuestion(1);
  renderQuestion();
}

// 유형 A — 분자식과 관측 m/z를 주고 이온 폼을 고르게 한다
function makeAdductQuestion(lv){
  const pool = adductPool(lv);
  // 같은 모드에 보기가 최소 둘은 있어야 문제가 성립한다 (난이도 1의 음이온 모드 등)
  const usable = pool.filter(a => pool.some(b => b !== a && Math.sign(b.z) === Math.sign(a.z)));
  const compounds = compoundPool(lv);
  // 화학적으로 성립하는 짝만 미리 모아 둔다
  const pairs = [];
  for(const c of compounds)
    for(const a of usable)
      if(adductOK(c, a) && ionFormula(parseFormula(c.f), a)) pairs.push([c, a]);
  let cmp, ad, neutral, peaks;
  if(pairs.length){
    [cmp, ad] = pick(pairs);
    neutral = parseFormula(cmp.f);
    peaks = ionSpectrum(neutral, ad, 0.8);
  }
  if(!peaks){                                  // 최후 보루: 항상 성립하는 조합
    cmp = COMPOUNDS[0]; ad = adductById("M+H");
    neutral = parseFormula(cmp.f);
    peaks = ionSpectrum(neutral, ad, 0.8);
  }

  const sameMode = pool.filter(a => Math.sign(a.z) === Math.sign(ad.z) && a.id !== ad.id);
  const options = sample([ad].concat(sample(sameMode, Math.min(3, sameMode.length))), 4);

  return {
    kind: "adduct", peaks, answer: ad.id, options, charge: ad.z,
    tag: "adduct:" + ad.id,
    prompt: P(`중성 분자식(neutral formula) <b>${formatFormula(neutral)}</b> 을 ` +
              `${ad.z > 0 ? "포지티브" : "네거티브"} 모드로 측정했습니다. 어떤 이온 폼(adduct)입니까?`,
             `The neutral formula <b>${formatFormula(neutral)}</b> was measured in ` +
              `${ad.z > 0 ? "positive" : "negative"} mode. Which adduct is this?`),
    sub: P(`${cmpKo(cmp)} · 단일동위원소 중성질량 ${monoisotopicMass(neutral).toFixed(4)}`,
           `${cmpEn(cmp)} · neutral monoisotopic mass ${monoisotopicMass(neutral).toFixed(4)}`),
    reveal: P(`${cmpKo(cmp)} · ${ad.label} · 기준 피크 m/z ${peaks[0].mz.toFixed(4)}`,
              `${cmpEn(cmp)} · ${ad.label} · base peak m/z ${peaks[0].mz.toFixed(4)}`),
    plot: {showMz:true, dp:3, title:`${ad.z > 0 ? "ESI+" : "ESI−"}`}
  };
}

// 유형 B — 세기 패턴만 보여주고 할로젠·황 조성을 고르게 한다
function makePatternQuestion(lv){
  const pool = PATTERNS.filter(p => p.tier <= lv);
  // 난이도 0에서는 풀이 비어 있다. 다른 유형으로 넘기도록 null 을 돌려준다.
  const adPool = ADDUCTS.filter(a => a.tier <= lv && a.z === 1 && !Object.keys(a.sub).length);
  if(!pool.length || !adPool.length) return null;
  const target = pick(pool);
  // 불포화도가 음수이거나 반정수인 분자식은 존재할 수 없으므로 다시 뽑는다
  let neutral = null;
  for(let guard = 0; guard < 200 && !neutral; guard++){
    const c = { C: 6 + Math.floor(Math.random()*8),
                H: 4 + Math.floor(Math.random()*8),
                O: 1 + Math.floor(Math.random()*3) };   // 산소를 최소 하나 둬 양이온화가 성립하게
    for(const el in target.add) c[el] = (c[el]||0) + target.add[el];
    const r = (c.C||0) - ((c.H||0) + (c.Cl||0) + (c.Br||0))/2 + 1;
    if(r >= 0 && Math.abs(r - Math.round(r)) < 1e-9) neutral = c;
  }
  if(!neutral) return null;

  // 패턴 문제에서는 원자를 빼지 않는 부가체만 써서 항상 성립하게 한다
  const ad = pick(adPool);
  const peaks = ionSpectrum(neutral, ad, 0.8);
  const others = pool.filter(p => p.id !== target.id);
  const options = sample([target].concat(sample(others, Math.min(3, others.length))), 4);

  return {
    kind: "pattern", peaks, answer: target.id, options, charge: ad.z,
    tag: "pattern:" + target.id,
    prompt: P("이 동위원소 클러스터(isotope cluster)의 세기 비로 볼 때 어떤 원소가 들어 있습니까?",
              "Judging from the intensity ratios in this isotope cluster, which element is present?"),
    sub: P("M, M+2, M+4 의 상대 세기를 보세요. m/z 절대값은 판단에 필요하지 않습니다.",
           "Compare the relative intensities of M, M+2 and M+4. The absolute m/z is not needed."),
    reveal: P(`${formatFormula(neutral)} · ${ad.label} · ${target.label.ko}`,
              `${formatFormula(neutral)} · ${ad.label} · ${target.label.en}`),
    plot: {showMz:false, title:P("동위원소 클러스터","Isotope cluster")}
  };
}

// 두 이온의 클러스터를 한 스펙트럼에 합친다
function mergeClusters(a, ha, b, hb){
  const raw = a.map(p => ({mz:p.mz, rel:p.rel*ha/100}))
        .concat(b.map(p => ({mz:p.mz, rel:p.rel*hb/100})));
  const base = Math.max(...raw.map(p => p.rel));
  return raw.map(p => ({mz:p.mz, rel:100*p.rel/base}))
            .filter(p => p.rel >= 1).sort((x,y) => x.mz - y.mz);
}

// 유형 C — 전구 이온과 프래그먼트를 보여주고 빠져나간 중성을 고르게 한다
function makeLossQuestion(lv){
  const compounds = compoundPool(lv).filter(c => c.losses && c.losses.length);
  const pool = LOSSES.filter(L => L.tier <= lv);

  for(let guard = 0; guard < 60; guard++){
    const cmp = pick(compounds);
    if(!cmp) return null;
    // 양성자화가 되면 [M+H]⁺, 아니면 탈양성자화되는 화합물만 [M−H]⁻ 로 낸다
    // 두 모드가 모두 가능하면 포지티브를 우선한다 (실제 LC-MS 사용 빈도 반영)
    let adId = null;
    if(cmp.prot && cmp.deprot) adId = Math.random() < 0.75 ? "M+H" : "M-H";
    else if(cmp.prot)   adId = "M+H";
    else if(cmp.deprot) adId = "M-H";
    if(!adId) continue;
    const ad = adductById(adId);
    const neutral = parseFormula(cmp.f);
    const ion = ionFormula(neutral, ad);
    if(!ion) continue;

    // 이 화합물에서 실제로 관측되는 손실만 후보로 삼는다
    const ok = pool.filter(L => cmp.losses.includes(L.id) && addCounts(ion, L.counts, -1) !== null);
    if(!ok.length) continue;

    const loss = pick(ok);
    const frag = addCounts(ion, loss.counts, -1);
    const pre  = ionSpectrum(neutral, ad, 1.5);
    const fSpec = isotopeDistribution(frag);
    const fBase = Math.max(...fSpec.map(d => d.p));
    const sign = ad.z > 0 ? -1 : +1;
    const fragPeaks = fSpec.map(d => ({mz: d.m + sign*ELECTRON, rel: 100*d.p/fBase}))
                           .filter(p => p.rel >= 1.5).sort((a,b) => a.mz - b.mz);
    if(!pre || !fragPeaks.length) continue;

    const preHigh = Math.random() < 0.5;
    const peaks = mergeClusters(pre, preHigh ? 100 : 45, fragPeaks, preHigh ? 60 : 100);

    const isobaric = pool.filter(L => L.id !== loss.id && L.nominal === loss.nominal);
    const others   = pool.filter(L => L.id !== loss.id && L.nominal !== loss.nominal);
    let distract;
    if(lv >= 3 && isobaric.length){
      distract = sample(isobaric, Math.min(2, isobaric.length));
      distract = distract.concat(sample(others, 3 - distract.length));
    }else{
      distract = sample(others, Math.min(3, others.length));
    }
    const options = sample([loss].concat(distract), 1 + distract.length);

    return {
      kind:"loss", peaks, answer:loss.id, options, charge:1,
      tag:"loss:" + loss.id,
      prompt:P(`<b>${ad.label}</b> 전구 이온(precursor ion)에서 프래그먼트(fragment) 하나가 ` +
               `생겼습니다. 빠져나간 중성 분자(neutral)는 무엇입니까?`,
              `A fragment has appeared from the <b>${ad.label}</b> precursor ion. ` +
               `Which neutral molecule was lost?`),
      sub:P("두 클러스터의 정확질량 차이를 읽으세요. 공칭 질량이 같아도 조성이 다르면 소수점이 달라집니다.",
            "Read the accurate mass difference between the two clusters. Compositions sharing a nominal mass still differ in the decimals."),
      reveal:P(`${cmpKo(cmp)} · ${formatFormula(neutral)} · −${loss.label} ` +
               `(Δ ${loss.mass.toFixed(4)}) · 프래그먼트 ${formatFormula(frag)}`,
              `${cmpEn(cmp)} · ${formatFormula(neutral)} · −${loss.label} ` +
               `(Δ ${loss.mass.toFixed(4)}) · fragment ${formatFormula(frag)}`),
      plot:{showMz:true, dp:4, labelMin:12,
            title:P((ad.z > 0 ? "ESI+" : "ESI−") + " · 전구 이온과 프래그먼트",
                    (ad.z > 0 ? "ESI+" : "ESI−") + " · precursor and fragment")}
    };
  }
  return null;
}

function renderQuestion(keepAnswer){
  const q = current;
  drawSpectrum(document.getElementById("plot-q"), q.peaks, q.plot);
  document.getElementById("q-prompt").innerHTML = tx(q.prompt);
  document.getElementById("q-sub").textContent  = tx(q.sub);
  document.getElementById("q-verdict").className = "verdict hidden";
  document.getElementById("q-details").open = false;
  document.getElementById("q-table").innerHTML = peakTable(q.peaks, q.kind === "pattern" ? 2 : 4, q.charge);

  const box = document.getElementById("q-opts");
  box.innerHTML = "";
  q.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = tx(o.label);
    b.dataset.id = o.id;
    b.addEventListener("click", () => answer(o.id));
    box.appendChild(b);
  });
  if(keepAnswer && q.picked !== undefined) showAnswerState(q.picked);
}

// 채점 결과 표시를 따로 떼어 언어 전환 후에도 복원할 수 있게 한다
function showAnswerState(id){
  const q = current;
  document.querySelectorAll("#q-opts .opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.id === q.answer) b.classList.add("right");
    else if(b.dataset.id === id)  b.classList.add("wrong");
  });
  const v = document.getElementById("q-verdict");
  v.className = "verdict";
  v.innerHTML = `<span class="name">${id === q.answer ? t("right") : t("wrong")}</span> ` +
                tx(q.reveal);
}

function answer(id){
  const q = current;
  const ok = id === q.answer;
  q.picked = id;
  showAnswerState(id);
  recordAnswer(ok, q.tag);
}

// 중성 질량 → 분자식 후보. RDB(불포화도)와 질소 규칙으로 거른다.
const SEARCH = [
  {el:"C", max:40}, {el:"H", max:80}, {el:"N",  max:6}, {el:"O", max:15},
  {el:"P", max:3},  {el:"S", max:2},  {el:"Cl", max:3}, {el:"Br", max:2}
];
// 불포화도. 할로젠은 H처럼, P는 N처럼 3가로 센다.
function rdb(c){
  return (c.C||0) - ((c.H||0) + (c.Cl||0) + (c.Br||0) + (c.F||0) + (c.I||0))/2
         + ((c.N||0) + (c.P||0))/2 + 1;
}
function findFormulas(targetMass, tolDa, limit){
  const M = {}; SEARCH.forEach(s => M[s.el] = ISO[s.el][0][0]);
  const hits = [];
  for(let nC = 0; nC <= 40 && nC*M.C <= targetMass + tolDa; nC++)
  for(let nBr = 0; nBr <= 2 && nC*M.C + nBr*M.Br <= targetMass + tolDa; nBr++)
  for(let nCl = 0; nCl <= 3 && nC*M.C + nBr*M.Br + nCl*M.Cl <= targetMass + tolDa; nCl++)
  for(let nS = 0; nS <= 2; nS++)
  for(let nP = 0; nP <= 3; nP++)
  for(let nN = 0; nN <= 6; nN++)
  for(let nO = 0; nO <= 15; nO++){
    const rest = targetMass -
      (nC*M.C + nBr*M.Br + nCl*M.Cl + nS*M.S + nP*M.P + nN*M.N + nO*M.O);
    if(rest < -tolDa) continue;
    const nH = Math.round(rest / M.H);
    if(nH < 0 || nH > 80) continue;
    const c = {C:nC, H:nH, N:nN, O:nO, P:nP, S:nS, Cl:nCl, Br:nBr};
    const err = monoisotopicMass(c) - targetMass;
    if(Math.abs(err) > tolDa) continue;
    const r = rdb(c);
    if(r < 0 || r > 30 || Math.abs(r - Math.round(r)) > 1e-9) continue;   // 짝수전자 중성분자
    hits.push({c, err, rdb:r});
  }
  return hits.sort((a,b) => Math.abs(a.err) - Math.abs(b.err)).slice(0, limit || 25);
}

function runFinder(){
  const out = document.getElementById("f-out");
  const mz  = parseFloat(document.getElementById("f-mz").value);
  const ppm = parseFloat(document.getElementById("f-ppm").value);
  const ad  = adductById(document.getElementById("f-adduct").value);
  if(!isFinite(mz) || !isFinite(ppm)){ out.innerHTML = `<p class="sub">${t("badNumber")}</p>`; return; }

  // 관측 m/z에서 부가체와 전하를 벗겨 중성 단일동위원소 질량을 얻는다
  const az = Math.abs(ad.z);
  const ionMass = mz * az + ad.z * ELECTRON;
  const neutralMass = ionMass - monoisotopicMass(ad.add) + monoisotopicMass(ad.sub);
  const tol = mz * az * ppm * 1e-6;

  if(neutralMass <= 0){ out.innerHTML = `<p class="sub">${t("tooSmall")}</p>`; return; }

  const hits = findFormulas(neutralMass, tol, 25);
  if(!hits.length){
    out.innerHTML = `<p class="sub">${t("neutralMass")} ${neutralMass.toFixed(4)} — ${t("noCand")}</p>`;
    return;
  }
  let h = `<p class="sub">${t("neutralMass")} ${neutralMass.toFixed(4)} · ` +
          `${t("candidates")} ${hits.length}</p>` +
          `<table><thead><tr><th>${t("thFormula")}</th><th class="num">${t("thCalcMz")}</th>` +
          `<th class="num">${t("thPpmErr")}</th><th class="num">${t("thRdb")}</th></tr></thead><tbody>`;
  hits.forEach(x => {
    const ion = ionFormula(x.c, ad);
    const calcMz = ion ? (monoisotopicMass(ion) - ad.z*ELECTRON) / az : NaN;
    const ppmErr = (calcMz - mz) / mz * 1e6;
    h += `<tr><td>${formatFormula(x.c)}</td><td class="num">${calcMz.toFixed(4)}</td>` +
         `<td class="num">${ppmErr.toFixed(2)}</td><td class="num">${x.rdb}</td></tr>`;
  });
  out.innerHTML = h + "</tbody></table>";
}

// 본문의 [^n] 을 위첨자 번호로, 그리고 패널 하단 미주 목록을 만든다
function marks(str){
  return String(str).replace(/\[\^(\d+)\]/g, (_, n) => `<sup class="fn">${n}</sup>`);
}
function noteList(list){
  if(!list || !list.length) return "";
  return "<h3>" + t("sources") + "</h3><ol class=\"notes\">" +
    list.map(n => {
      const href = safeUrl(n.u);       // http/https 가 아니면 링크 없이 제목만 남긴다
      return "<li>" + (href
        ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(n.t)}</a>`
        : esc(n.t)) + "</li>";
    }).join("") + "</ol>";
}

}

   11. 초기화
   ══════════════════════════════════════════════════════════════ */
function fillLevels(){
  const sel = document.getElementById("level");
  sel.innerHTML = LEVELS.map(l =>
    `<option value="${l.v}">${LANG === "ko" ? l.ko : l.en}</option>`).join("");
  sel.value = save.level;
}
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t("docTitle");
  document.getElementById("app-sub").textContent    = t("appSub");
  document.getElementById("level-label").textContent = t("levelLabel");
  document.getElementById("lang-toggle").textContent = t("langBtn");
  document.getElementById("foot-note").textContent   = t("footNote");
  document.querySelectorAll("[data-i18n]").forEach(n => {
    n.textContent = t(n.dataset.i18n);
  });
}
function renderAll(){
  applyStatic();
  fillLevels();
  renderBriefing();
  renderAppendix();
  renderStats();
  if(!document.getElementById("view-about").classList.contains("hidden")) renderAbout();
  runLab();
  document.getElementById("f-out").innerHTML = "";
  if(current) renderQuestion(true);           // 같은 문제를 새 언어로 다시 그린다
  else newQuestion();
}
function setLang(lang){
  LANG = lang;
  save.lang = lang;
  persist();
  renderAll();
}

// 값을 textContent 로만 넣어 표시 경로에서 마크업이 해석될 여지를 없앤다
function row(tbody, label, value){
  const tr = document.createElement("tr");
  const th = document.createElement("td");
  const td = document.createElement("td");
  th.textContent = label;
  td.textContent = value || t("fEmpty");
  td.className = "num";
  tr.append(th, td);
  tbody.appendChild(tr);
}
// URL 이 http/https 로 검증될 때만 링크로, 아니면 텍스트로 넣는다.
// 문자열을 조립하지 않으므로 이스케이프를 빠뜨릴 여지가 없다.
function rowLink(tbody, label, url){
  const href = safeUrl(url);
  const tr = document.createElement("tr");
  const th = document.createElement("td");
  const td = document.createElement("td");
  th.textContent = label;
  td.className = "num";
  if(href){
    const a = document.createElement("a");
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = href;
    td.appendChild(a);
  }else{
    td.textContent = url ? String(url) : t("fEmpty");
  }
  tr.append(th, td);
  tbody.appendChild(tr);
}

async function renderAbout(){
  document.getElementById("about-title").textContent = t("aboutTitle");
  document.getElementById("about-sub").textContent   = t("aboutSub");
  const rows = document.getElementById("about-rows");
  rows.innerHTML = "";
  row(rows, t("fApp"),     BUILD.app);
  row(rows, t("fVersion"), BUILD.version);
  row(rows, t("fBuilt"),   BUILD.built);
  row(rows, t("fAuthor"),  tx(BUILD.author));
  row(rows, t("fDegree"),  tx(BUILD.degree));
  rowLink(rows, t("fRepo"), BUILD.repo);
  row(rows, t("fLicense"), BUILD.license);
  row(rows, t("fIsotope"), BUILD.isotopeData);

  document.getElementById("integrity-title").textContent = t("integTitle");
  document.getElementById("integrity-sub").textContent   = t("integSub");
  document.getElementById("integrity-note").textContent  = t("integNote");
  const ir = document.getElementById("integrity-rows");
  ir.innerHTML = "";
  const now = await buildHash();
  row(ir, t("integRecorded"), BUILD_DIGEST.slice(0,16) + "…");
  row(ir, t("integCurrent"),  now ? now.slice(0,16) + "…" : "—");
  const tr = document.createElement("tr");
  const th = document.createElement("td"), td = document.createElement("td");
  th.textContent = t("integVerdict");
  td.textContent = now === null ? t("integNA") : (now === BUILD_DIGEST ? t("integOK") : t("integBad"));
  td.style.color = now === null ? "var(--muted)"
                 : (now === BUILD_DIGEST ? "var(--right)" : "var(--wrong)");
  tr.append(th, td);
  ir.appendChild(tr);
}

const VIEWS = ["quiz","lab","log","about"];
function showView(name, focus){
  VIEWS.forEach(v => {
    const on = v === name;
    document.getElementById("view-" + v).classList.toggle("hidden", !on);
    const tab = document.getElementById("tab-" + v);
    tab.setAttribute("aria-selected", String(on));
    tab.tabIndex = on ? 0 : -1;              // 로빙 탭인덱스
    if(on && focus) tab.focus();
  });
  if(name === "log") renderStats();
  if(name === "about") renderAbout();
}
// 탭 목록 안에서는 좌우 방향키로 이동한다 (WAI-ARIA 탭 패턴)
document.getElementById("tabs").addEventListener("keydown", e => {
  const i = VIEWS.indexOf(
    (document.activeElement.id || "").replace("tab-", ""));
  if(i < 0) return;
  let j = null;
  if(e.key === "ArrowRight") j = (i + 1) % VIEWS.length;
  else if(e.key === "ArrowLeft") j = (i - 1 + VIEWS.length) % VIEWS.length;
  else if(e.key === "Home") j = 0;
  else if(e.key === "End") j = VIEWS.length - 1;
  if(j === null) return;
  e.preventDefault();
  showView(VIEWS[j], true);
});

save = loadSave();
LANG = save.lang === "en" ? "en" : "ko";
fillAdductSelect(document.getElementById("l-adduct"));
fillAdductSelect(document.getElementById("f-adduct"));
document.getElementById("l-adduct").value = "M-H";
document.getElementById("f-adduct").value = "M-H";
document.getElementById("tab-quiz").onclick = () => showView("quiz");
document.getElementById("tab-lab").onclick  = () => showView("lab");
document.getElementById("tab-log").onclick  = () => showView("log");
document.getElementById("tab-about").onclick = () => showView("about");
document.getElementById("level").onchange = e => {
  const dropped = current && current.picked === undefined;   // 채점 전이었나
  save.level = parseInt(e.target.value, 10);
  persist(); renderBriefing(); renderAppendix(); newQuestion();
  if(dropped){
    const v = document.getElementById("q-verdict");
    v.className = "verdict";
    v.textContent = t("levelDropped");
  }
};
document.getElementById("brief-toggle").onclick = () => {
  const on = document.getElementById("brief-toggle").getAttribute("aria-expanded") !== "true";
  setBriefOpen(on);
  if(!on){ save.briefed[save.level] = true; persist(); }   // 접으면 읽은 것으로 본다
};
document.getElementById("appx-toggle").onclick = () => {
  const on = document.getElementById("appx-toggle").getAttribute("aria-expanded") !== "true";
  setAppxOpen(on);
  if(!on){ save.appx[save.level] = true; persist(); }
};
document.getElementById("q-next").onclick  = newQuestion;
document.getElementById("l-run").onclick = runLab;
document.getElementById("f-run").onclick = runFinder;
document.getElementById("e-export").onclick = exportSave;
document.getElementById("e-import").onclick = () => document.getElementById("e-file").click();
document.getElementById("e-file").onchange = e => { if(e.target.files[0]) importSave(e.target.files[0]); };
document.getElementById("e-reset").onclick = () => {
  save = blankSave(); persist(); renderStats();
  document.getElementById("save-note").textContent = t("saveCleared");
};

document.getElementById("lang-toggle").onclick = () => setLang(LANG === "ko" ? "en" : "ko");

persist();
newQuestion();
renderAll();
</script>
